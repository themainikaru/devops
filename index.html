<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>CPS Test</title>

<style>
    body {
        margin: 0;
        min-height: 100vh;
        display: flex;
        justify-content: center;
        align-items: center;
        background: #111;
        color: white;
        font-family: Arial, sans-serif;
    }

    .container {
        text-align: center;
        width: 90%;
        max-width: 500px;
    }

    h1 {
        font-size: 42px;
        margin-bottom: 10px;
    }

    #timer {
        font-size: 24px;
        margin-bottom: 20px;
        color: #aaa;
    }

    #clickButton {
        width: 100%;
        height: 250px;
        border: none;
        border-radius: 20px;
        background: #5865f2;
        color: white;
        font-size: 36px;
        font-weight: bold;
        cursor: pointer;
        user-select: none;
        transition: 0.1s;
    }

    #clickButton:active {
        transform: scale(0.98);
        background: #4752c4;
    }

    #result {
        margin-top: 25px;
        font-size: 28px;
    }

    #restart {
        margin-top: 20px;
        padding: 12px 25px;
        border: none;
        border-radius: 10px;
        background: #2ecc71;
        color: white;
        font-size: 18px;
        cursor: pointer;
    }
</style>
</head>

<body>

<div class="container">
    <h1>CPS Test</h1>

    <div id="timer">Нажми кнопку, чтобы начать</div>

    <button id="clickButton">
        КЛИКАЙ!
    </button>

    <div id="result"></div>

    <button id="restart">Начать заново</button>
</div>

<script>
const button = document.getElementById("clickButton");
const timer = document.getElementById("timer");
const result = document.getElementById("result");
const restart = document.getElementById("restart");

let clicks = 0;
let startTime = null;
let running = false;
let finished = false;

const TEST_TIME = 1000; // 1 секунда

button.addEventListener("click", () => {
    if (finished) return;

    // Первый клик запускает тест
    if (!running) {
        running = true;
        startTime = performance.now();

        timer.textContent = "Осталось: 1.00 сек";

        setTimeout(finishTest, TEST_TIME);
    }

    clicks++;

    // Показываем текущие клики
    result.textContent = `Кликов: ${clicks}`;
});

function finishTest() {
    running = false;
    finished = true;

    const cps = clicks / (TEST_TIME / 1000);

    timer.textContent = "Тест завершён!";
    result.innerHTML = `
        Кликов: <b>${clicks}</b><br>
        CPS: <b>${cps.toFixed(2)}</b>
    `;
}

restart.addEventListener("click", () => {
    clicks = 0;
    startTime = null;
    running = false;
    finished = false;

    timer.textContent = "Нажми кнопку, чтобы начать";
    result.textContent = "";

    button.textContent = "КЛИКАЙ!";
});
</script>

</body>
</html>
