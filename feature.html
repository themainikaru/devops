<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Моя страница</title>

    <style>
        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            font-family: Arial, sans-serif;
            background: linear-gradient(135deg, #667eea, #764ba2);
            color: white;
        }

        .card {
            width: 90%;
            max-width: 500px;
            padding: 40px;
            text-align: center;
            border-radius: 24px;
            background: rgba(255, 255, 255, 0.15);
            backdrop-filter: blur(12px);
            box-shadow: 0 20px 50px rgba(0, 0, 0, 0.25);
        }

        h1 {
            font-size: 42px;
            margin-bottom: 15px;
        }

        p {
            font-size: 18px;
            opacity: 0.9;
        }

        button {
            margin-top: 20px;
            padding: 14px 28px;
            border: none;
            border-radius: 999px;
            background: white;
            color: #6c4bb3;
            font-size: 16px;
            font-weight: bold;
            cursor: pointer;
            transition: 0.2s;
        }

        button:hover {
            transform: scale(1.05);
        }
    </style>
</head>

<body>

    <div class="card">
        <h1>Привет! 👋</h1>

        <p id="text">
            Это маленький сайт, созданный на HTML, CSS и JavaScript.
        </p>

        <button onclick="changeText()">
            Нажми меня
        </button>
    </div>

    <script>
        function changeText() {
            document.getElementById("text").textContent =
                "Ты только что изменил содержимое страницы! 🚀";
        }
    </script>

</body>
</html>
